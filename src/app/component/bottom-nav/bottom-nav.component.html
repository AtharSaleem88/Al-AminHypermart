<!-- ==================== Instagram-Inspired Mobile Bottom Nav ==================== -->
<nav class="bottom-nav d-lg-none" aria-label="Mobile Navigation">
    <div class="bottom-nav__container">
        
        <!-- 1. Home -->
        <a [routerLink]="['/']" class="bottom-nav__item" [class.is-active]="isRouteActive('/')">
            <div class="bottom-nav__icon-wrapper">
                <i class="ph-bold ph-house bottom-nav__icon" [class.d-none]="isRouteActive('/')"></i>
                <i class="ph-fill ph-house bottom-nav__icon-active" [class.d-none]="!isRouteActive('/')"></i>
            </div>
            <span class="bottom-nav__label">Home</span>
            <!-- Al-Amin Smile Active Indicator -->
            <div class="bottom-nav__smile-bar" *ngIf="isRouteActive('/')">
                <img src="assets/images/logo/smile-curve.svg" alt="Active" class="bottom-nav__smile-img">
            </div>
        </a>

        <!-- 2. Categories -->
        <a [routerLink]="['/shop']" class="bottom-nav__item" [class.is-active]="isRouteActive('/shop')">
            <div class="bottom-nav__icon-wrapper">
                <i class="ph-bold ph-squares-four bottom-nav__icon" [class.d-none]="isRouteActive('/shop')"></i>
                <i class="ph-fill ph-squares-four bottom-nav__icon-active" [class.d-none]="!isRouteActive('/shop')"></i>
            </div>
            <span class="bottom-nav__label">Categories</span>
            <div class="bottom-nav__smile-bar" *ngIf="isRouteActive('/shop')">
                <img src="assets/images/logo/smile-curve.svg" alt="Active" class="bottom-nav__smile-img">
            </div>
        </a>

        <!-- 3. Search Trigger (Opens quick-search sheet) -->
        <button type="button" class="bottom-nav__item border-0 bg-transparent p-0" (click)="openSearch()" aria-label="Search Catalog">
            <div class="bottom-nav__icon-wrapper">
                <i class="ph-bold ph-magnifying-glass bottom-nav__icon"></i>
            </div>
            <span class="bottom-nav__label">Search</span>
        </button>

        <!-- 4. Cart -->
        <a [routerLink]="['/cart']" class="bottom-nav__item" [class.is-active]="isRouteActive('/cart')">
            <div class="bottom-nav__icon-wrapper position-relative">
                <i class="ph-bold ph-shopping-cart-simple bottom-nav__icon" [class.d-none]="isRouteActive('/cart')"></i>
                <i class="ph-fill ph-shopping-cart-simple bottom-nav__icon-active" [class.d-none]="!isRouteActive('/cart')"></i>
                <!-- Cart Count Badge in Brand Amber -->
                <span class="bottom-nav__badge bg-main-two-600 text-white">{{ cartService.itemCount() }}</span>
            </div>
            <span class="bottom-nav__label">Cart</span>
            <div class="bottom-nav__smile-bar" *ngIf="isRouteActive('/cart')">
                <img src="assets/images/logo/smile-curve.svg" alt="Active" class="bottom-nav__smile-img">
            </div>
        </a>

        <!-- 5. Account -->
        <a [routerLink]="['/account']" class="bottom-nav__item" [class.is-active]="isRouteActive('/account')">
            <div class="bottom-nav__icon-wrapper">
                <i class="ph-bold ph-user bottom-nav__icon" [class.d-none]="isRouteActive('/account')"></i>
                <i class="ph-fill ph-user bottom-nav__icon-active" [class.d-none]="!isRouteActive('/account')"></i>
            </div>
            <span class="bottom-nav__label">Account</span>
            <div class="bottom-nav__smile-bar" *ngIf="isRouteActive('/account')">
                <img src="assets/images/logo/smile-curve.svg" alt="Active" class="bottom-nav__smile-img">
            </div>
        </a>

    </div>
</nav>

<!-- ==================== Quick Search Drawer (Mobile) ==================== -->
<div class="mobile-search-modal" *ngIf="isSearchModalOpen">
    <div class="mobile-search-backdrop" (click)="closeSearch()"></div>
    <div class="mobile-search-sheet">
        <div class="mobile-search-sheet__handle"></div>
        <div class="d-flex align-items-center justify-content-between mb-16">
            <div class="d-flex align-items-center gap-8">
                <img src="assets/images/logo/smile-badge.svg" alt="Al-Amin" style="width: 24px; height: 24px;">
                <span class="fw-bold text-main-600 text-sm">Life. Stocked.</span>
            </div>
            <button type="button" class="btn-close-search border-0 bg-transparent text-gray-500 text-xl" (click)="closeSearch()" aria-label="Close search">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <form (ngSubmit)="onSearchSubmit()" class="mb-20">
            <div class="position-relative">
                <input type="text" [(ngModel)]="searchQuery" name="searchQuery"
                    class="form-control bg-gray-50 border border-gray-200 py-12 ps-16 pe-48 rounded-12 text-sm text-heading placeholder-text-sm"
                    placeholder="Search fresh grocery, pantry, meat..." autofocus>
                <button type="submit" class="position-absolute top-50 translate-middle-y inset-inline-end-0 me-6 w-36 h-36 bg-main-600 text-white rounded-8 flex-center border-0" aria-label="Search">
                    <i class="ph ph-magnifying-glass text-lg"></i>
                </button>
            </div>
        </form>

        <div class="popular-searches">
            <div class="text-xs fw-bold text-gray-500 text-uppercase mb-10 letter-spacing-1">Trending Searches</div>
            <div class="d-flex flex-wrap gap-8">
                <button *ngFor="let term of popularSearches" type="button"
                    (click)="selectPopularSearch(term)"
                    class="btn-search-pill py-6 px-12 rounded-pill bg-gray-50 border border-gray-200 text-xs text-heading fw-medium hover-bg-main-50 hover-border-main-100 transition-1">
                    <i class="ph-bold ph-trend-up text-main-two-600 me-4"></i>
                    {{ term }}
                </button>
            </div>
        </div>
    </div>
</div>
