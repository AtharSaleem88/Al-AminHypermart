<nav class="bottom-nav d-lg-none" aria-label="Mobile Navigation">
  <div class="bottom-nav__container">
    <a routerLink="/" class="bottom-nav__item" [class.is-active]="isRouteActive('/')" aria-label="Home" [attr.aria-current]="isRouteActive('/') ? 'page' : null"><i [class]="isRouteActive('/') ? 'ph-fill ph-house' : 'ph ph-house'" aria-hidden="true"></i><span class="visually-hidden">Home</span></a>
    <button type="button" class="bottom-nav__item" [class.is-active]="isSearchModalOpen" (click)="openSearch()" aria-label="Search products" [attr.aria-expanded]="isSearchModalOpen"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span class="visually-hidden">Search</span></button>
    <a routerLink="/shop" class="bottom-nav__item" [class.is-active]="isRouteActive('/shop')" aria-label="Shop categories" [attr.aria-current]="isRouteActive('/shop') ? 'page' : null"><i [class]="isRouteActive('/shop') ? 'ph-fill ph-squares-four' : 'ph ph-squares-four'" aria-hidden="true"></i><span class="visually-hidden">Categories</span></a>
    <a data-cart-animation-target routerLink="/cart" class="bottom-nav__item" [class.is-active]="isRouteActive('/cart')" [attr.aria-label]="'Basket, ' + cartService.itemCount() + ' items'" [attr.aria-current]="isRouteActive('/cart') ? 'page' : null"><span class="bottom-nav__cart"><i [class]="isRouteActive('/cart') ? 'ph-fill ph-shopping-bag' : 'ph ph-shopping-bag'" aria-hidden="true"></i>@if (cartService.itemCount()) { <span class="bottom-nav__badge" aria-hidden="true">{{ cartService.itemCount() > 99 ? '99+' : cartService.itemCount() }}</span> }</span><span class="visually-hidden">Basket</span></a>
    <a routerLink="/account" class="bottom-nav__item" [class.is-active]="isRouteActive('/account')" aria-label="Your account" [attr.aria-current]="isRouteActive('/account') ? 'page' : null"><span class="bottom-nav__profile" [class.has-user]="!!account.user()">@if (account.user(); as user) { {{ user.name.charAt(0).toUpperCase() }} } @else { <i class="ph ph-user" aria-hidden="true"></i> }</span><span class="visually-hidden">Account</span></a>
  </div>
</nav>
<!-- ==================== Quick Search Drawer (Mobile) ==================== -->
<div class="mobile-search-modal" *ngIf="isSearchModalOpen">
    <div class="mobile-search-backdrop" (click)="closeSearch()"></div>
    <div class="mobile-search-sheet">
        <div class="mobile-search-sheet__handle"></div>
        <div class="d-flex align-items-center justify-content-between mb-16">
            <div class="d-flex align-items-center gap-8">
                <img src="assets/images/logo/smile-badge.svg" alt="Al-Amin" style="width: 24px; height: 24px;">
                <span class="fw-bold text-main-600 text-sm">Life. Stocked.</span>
            </div>
            <button type="button" class="btn-close-search border-0 bg-transparent text-gray-500 text-xl" (click)="closeSearch()" aria-label="Close search">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <form (ngSubmit)="onSearchSubmit()" class="mb-20">
            <div class="position-relative">
                <input type="text" [(ngModel)]="searchQuery" name="searchQuery"
                    class="form-control bg-gray-50 border border-gray-200 py-12 ps-16 pe-48 rounded-12 text-sm text-heading placeholder-text-sm"
                    placeholder="Search fresh grocery, pantry, meat..." autofocus>
                <button type="submit" class="position-absolute top-50 translate-middle-y inset-inline-end-0 me-6 w-36 h-36 bg-main-600 text-white rounded-8 flex-center border-0" aria-label="Search">
                    <i class="ph ph-magnifying-glass text-lg"></i>
                </button>
            </div>
        </form>

        <div class="popular-searches">
            <div class="text-xs fw-bold text-gray-500 text-uppercase mb-10 letter-spacing-1">Trending Searches</div>
            <div class="d-flex flex-wrap gap-8">
                <button *ngFor="let term of popularSearches" type="button"
                    (click)="selectPopularSearch(term)"
                    class="btn-search-pill py-6 px-12 rounded-pill bg-gray-50 border border-gray-200 text-xs text-heading fw-medium hover-bg-main-50 hover-border-main-100 transition-1">
                    <i class="ph-bold ph-trend-up text-main-two-600 me-4"></i>
                    {{ term }}
                </button>
            </div>
        </div>
    </div>
</div>
